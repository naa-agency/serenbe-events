name: Robin

# AI code review on pull requests (https://github.com/antongulin/robin).
# Runs when a PR is opened, reopened or marked ready, and on PR comments
# that call Robin. Secrets: LLM_API_KEY, LLM_BASE_URL, LLM_MODEL.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    uses: antongulin/robin/.github/workflows/review.yml@main
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
